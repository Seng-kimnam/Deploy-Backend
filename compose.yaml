version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123@456   # change this!
      POSTGRES_DB: lawfirm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: add your Spring Boot app here later
  # lawfirm-api:
  #   build: .
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lawfirm_db

volumes:
  postgres_data:
  storage: