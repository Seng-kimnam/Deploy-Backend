version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123  # change this!
      POSTGRES_DB: lawfirm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Password123#   # change in production!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage:/data

  lawfirm-app:                              # your Spring Boot app
    image: lawfirm-api-image:latest
    build: .                                # remove if you already have an image
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lawfirm_db
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:

