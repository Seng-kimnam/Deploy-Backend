<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lumnov Register Request</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        .notification-card {
            margin: auto;
            width: 100%;
            max-width: 480px;
            background-color: white;
            border-radius: 8px;
            padding: 24px;

        }

        .google-logo {
            margin-bottom: 15px;
            width: 75px;
            height: auto;
        }

        .email-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .email-avatar {
            background-color: #4285f4;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 8px;
        }

        .email-text {
            color: #5f6368;
            font-size: 14px;
        }

        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 20px 0;
        }

        .message {
            color: #5f6368;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: left;
        }

        .check-activity-btn {
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .check-activity-btn:hover {
            background-color: #3367d6;
        }

        .footer-text {
            margin-top: 20px;
            color: #5f6368;
            font-size: 12px;
        }

        .footer-link {
            color: #4285f4;
            text-decoration: none;
        }

        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div style="border: 1px solid black" class="notification-card">
    <div style="text-align: center;">
        <h2 style="border-radius: 5px; background-color:#000280; width: 120px; padding: 5px 10px; color: white; margin: auto;"><span style="color:red;">GCL</span>aw Group</h2>
        <h2 style="margin-top: 20px;">Email Request Registration</h2>
    </div>

    <div style="margin-top: 20px;">
        <h3>Basic Information</h3>
        <div>
            <span>Name: </span>
            <span th:text="${fullName}"></span>
        </div>
        <div>
            <span>Email: </span>
            <span th:text="${email}"></span>
        </div>
        <div>
            <span>Phone Number: </span>
            <span th:text="${phoneNumber}"></span>
        </div>
    </div>

    <div class="divider"></div>

    <button class="check-activity-btn">Go to Approval Page</button>
</div>
</body>
</html>
